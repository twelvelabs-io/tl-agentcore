name: daily-smoke

# Smoke run against a deployed stack. Chromium suite only (no cross-
# browser, no MediaConvert), posts a one-line summary to Slack on
# completion (success or failure), and archives the full report for
# two weeks.
#
# Manual trigger only — the reference repo has no deployed target,
# so a cron would just spam failures. Consumers who fork and deploy
# should add their own schedule alongside workflow_dispatch and set:
#   1. The same E2E secrets as e2e.yml.
#   2. SLACK_WEBHOOK_URL pointing at the channel for build pings.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install ui deps
        working-directory: ui
        run: npm ci

      - name: Install Playwright (chromium only)
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Write .env.test
        working-directory: ui/e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_KS_ID: ${{ secrets.TEST_KS_ID }}
          TEST_EMPTY_KS_ID: ${{ secrets.TEST_EMPTY_KS_ID }}
          TL_API_KEY: ${{ secrets.TL_API_KEY }}
        run: |
          cat > .env.test <<EOF
          E2E_BASE_URL=$E2E_BASE_URL
          TEST_USER_EMAIL=$TEST_USER_EMAIL
          TEST_USER_PASSWORD=$TEST_USER_PASSWORD
          TEST_KS_ID=$TEST_KS_ID
          TEST_EMPTY_KS_ID=$TEST_EMPTY_KS_ID
          TL_API_KEY=$TL_API_KEY
          EOF

      - name: Run smoke (chromium)
        working-directory: ui
        run: npx playwright test --project=chromium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-report-${{ github.run_id }}
          path: ui/playwright-report
          retention-days: 14

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sX POST -H 'content-type: application/json' \
            --data "{\"text\": \":white_check_mark: tl-agentcore daily smoke passed (run ${{ github.run_id }})\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sX POST -H 'content-type: application/json' \
            --data "{\"text\": \":x: tl-agentcore daily smoke FAILED — <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_id }}>\"}" \
            "$SLACK_WEBHOOK_URL"
