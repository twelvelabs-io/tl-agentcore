name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install ui deps
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Write .env.test
        working-directory: ui/e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_KS_ID: ${{ secrets.TEST_KS_ID }}
          TEST_EMPTY_KS_ID: ${{ secrets.TEST_EMPTY_KS_ID }}
          TL_API_KEY: ${{ secrets.TL_API_KEY }}
        run: |
          cat > .env.test <<EOF
          E2E_BASE_URL=$E2E_BASE_URL
          TEST_USER_EMAIL=$TEST_USER_EMAIL
          TEST_USER_PASSWORD=$TEST_USER_PASSWORD
          TEST_KS_ID=$TEST_KS_ID
          TEST_EMPTY_KS_ID=$TEST_EMPTY_KS_ID
          TL_API_KEY=$TL_API_KEY
          EOF

      # Chromium runs the full suite; Firefox + WebKit run the curated
      # smoke set declared inline in playwright.config.ts.
      - name: Run Playwright (chromium)
        working-directory: ui
        run: npx playwright test --project=chromium

      - name: Run Playwright (firefox + webkit smoke)
        working-directory: ui
        run: npx playwright test --project=firefox --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 14

      - name: Upload trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: ui/test-results
          retention-days: 14
