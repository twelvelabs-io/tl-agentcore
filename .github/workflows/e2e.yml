name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default. Individual steps that need write (e.g. artifact
# upload) already declare their needs at the action level.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Don't leave the GITHUB_TOKEN sitting in `.git/config` after
          # checkout — subsequent steps then can't accidentally push
          # or leak it via artifacts.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install ui deps
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Write .env.test
        working-directory: ui/e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_KS_ID: ${{ secrets.TEST_KS_ID }}
          TEST_EMPTY_KS_ID: ${{ secrets.TEST_EMPTY_KS_ID }}
          TL_API_KEY: ${{ secrets.TL_API_KEY }}
        run: |
          cat > .env.test <<EOF
          E2E_BASE_URL=$E2E_BASE_URL
          TEST_USER_EMAIL=$TEST_USER_EMAIL
          TEST_USER_PASSWORD=$TEST_USER_PASSWORD
          TEST_KS_ID=$TEST_KS_ID
          TEST_EMPTY_KS_ID=$TEST_EMPTY_KS_ID
          TL_API_KEY=$TL_API_KEY
          EOF

      # Chromium runs the full suite; Firefox + WebKit run the curated
      # smoke set declared inline in playwright.config.ts.
      - name: Run Playwright (chromium)
        working-directory: ui
        run: npx playwright test --project=chromium

      - name: Run Playwright (firefox + webkit smoke)
        working-directory: ui
        run: npx playwright test --project=firefox --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 14

      - name: Upload trace + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: ui/test-results
          retention-days: 14
